<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="100%" stop-color="#00b36b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="420" height="340" rx="18" fill="url(#bg)"/>

  <!-- ambient glow behind screen -->
  <circle cx="210" cy="150" r="150" fill="url(#glow)"/>

  <!-- desk -->
  <rect x="40" y="270" width="340" height="14" rx="4" fill="#30363d"/>
  <rect x="60" y="284" width="14" height="30" fill="#21262d"/>
  <rect x="346" y="284" width="14" height="30" fill="#21262d"/>

  <!-- monitor -->
  <rect x="120" y="90" width="180" height="120" rx="8" fill="#161b22" stroke="#00ff9c" stroke-width="2"/>
  <rect x="132" y="102" width="156" height="96" rx="4" fill="#0a0f14"/>
  <rect x="200" y="210" width="20" height="18" fill="#30363d"/>
  <rect x="180" y="228" width="60" height="8" rx="3" fill="#30363d"/>

  <!-- terminal text lines -->
  <text x="142" y="122" font-family="monospace" font-size="9" fill="#00ff9c">$ nmap -sV target</text>
  <text x="142" y="136" font-family="monospace" font-size="9" fill="#39d353">[+] port 22 open</text>
  <text x="142" y="150" font-family="monospace" font-size="9" fill="#39d353">[+] port 443 open</text>
  <text x="142" y="164" font-family="monospace" font-size="9" fill="#f0883e">[!] scanning...</text>
  <text x="142" y="178" font-family="monospace" font-size="9" fill="#00ff9c">$ _</text>

  <!-- hooded figure silhouette -->
  <g transform="translate(210,255)">
    <ellipse cx="0" cy="14" rx="46" ry="16" fill="#000000" opacity="0.25"/>
    <path d="M -34 10 Q -34 -46 0 -50 Q 34 -46 34 10 Z" fill="#1f2937"/>
    <ellipse cx="0" cy="-40" rx="20" ry="20" fill="#2d333b"/>
    <path d="M -22 -34 Q 0 -66 22 -34 Q 24 -10 0 -8 Q -24 -10 -22 -34 Z" fill="#0d1117"/>
    <circle cx="-8" cy="-38" r="2.4" fill="#00ff9c"/>
    <circle cx="8" cy="-38" r="2.4" fill="#00ff9c"/>
  </g>

  <!-- keyboard -->
  <rect x="150" y="238" width="120" height="16" rx="3" fill="#21262d" stroke="#30363d"/>

  <!-- floating shield / lock icon -->
  <g transform="translate(340,60)">
    <path d="M0 -18 L16 -10 V6 C16 20 8 28 0 32 C-8 28 -16 20 -16 6 V-10 Z" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
    <rect x="-6" y="0" width="12" height="10" rx="2" fill="#00ff9c"/>
    <path d="M-4 0 V-4 A4 4 0 0 1 4 -4 V0" fill="none" stroke="#00ff9c" stroke-width="2"/>
  </g>

  <!-- floating binary bits -->
  <text x="30" y="50" font-family="monospace" font-size="12" fill="#238636">01</text>
  <text x="60" y="35" font-family="monospace" font-size="10" fill="#2ea043">10</text>
  <text x="370" y="130" font-family="monospace" font-size="11" fill="#238636">01</text>
  <text x="380" y="170" font-family="monospace" font-size="10" fill="#2ea043">11</text>
  <text x="20" y="200" font-family="monospace" font-size="10" fill="#238636">00</text>
</svg>
